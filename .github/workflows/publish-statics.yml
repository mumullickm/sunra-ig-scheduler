name: Sunra Statics publish

# Statics to IG + FB, 1/day at 21:00 BD (15:00 UTC). Cron at 15:05 UTC, with a 17:05 UTC
# backup tick. Self-heals: any due-but-unposted static goes out next tick.
on:
  schedule:
    - cron: '5 15 * * *'
    - cron: '5 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sunra-publisher
  cancel-in-progress: false

jobs:
  publish-statics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish due statics (IG + FB)
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
        run: python3 run_statics.py
      - name: Commit updated state
        run: |
          git config user.name "sunra-bot"
          git config user.email "sunra-bot@users.noreply.github.com"
          git add posted_statics.json
          git diff --staged --quiet && { echo "no state change to push"; exit 0; }
          git commit -m "state: update posted statics [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "state pushed on attempt $i"; exit 0
            fi
            echo "push attempt $i lost a race, retrying..."; sleep $((RANDOM % 4 + 2))
          done
          echo "::error::failed to push posted_statics.json after 5 attempts"; exit 1
