name: Sunra FB native schedule

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sunra-publisher
  cancel-in-progress: false

jobs:
  schedule-fb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest state (never post from a stale checkout)
        run: git fetch origin main && git reset --hard origin/main
      - name: Schedule upcoming legends on FB
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
        run: python3 schedule_fb.py
      - name: Commit updated state
        if: always()
        run: |
          git config user.name "sunra-bot"
          git config user.email "sunra-bot@users.noreply.github.com"
          git add posted_statics.json
          git diff --staged --quiet && { echo "no state change to push"; exit 0; }
          git commit -m "state: FB native schedule [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "state pushed on attempt $i"; exit 0
            fi
            echo "push attempt $i lost a race, retrying..."; sleep $((RANDOM % 4 + 2))
          done
          echo "::error::failed to push posted_statics.json after 5 attempts"; exit 1
